name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if test -z "$SDKMANAGER"; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendifier.p12"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/attendifier.p12"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          bash android-launcher/build.sh
          rm "$ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: AttendiFier-v1.1
          path: android-launcher/build/AttendiFier-v1.1.apk
      - name: Attach APK to the v1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1 android-launcher/build/AttendiFier-v1.1.apk --clobber
