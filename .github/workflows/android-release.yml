name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and release (for example 1.3)
        required: true
        default: "1.3"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ATTENDIFIER_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if test -z "$SDKMANAGER"; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendifier.p12"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/attendifier.p12"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          bash android-launcher/build.sh
          rm "$ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: AttendiFier-v${{ inputs.version }}
          path: android-launcher/build/AttendiFier-v${{ inputs.version }}.apk
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$ATTENDIFIER_VERSION"
          APK="android-launcher/build/AttendiFier-v$V.apk"
          SUM="$(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "AttendiFier v$V for Android."
            echo
            echo "- Opens AttendiFier full screen with no browser address bar (Trusted Web Activity)."
            echo "- Camera, fingerprint/passkey, saved data and Excel downloads keep working through the phone's browser."
            echo "- Installs over v1.1 (same signing key); no need to uninstall first."
            echo "- Falls back to the v1.1 browser tab if the phone's browser can't open it full screen."
            echo "- Android 6.0+; internet access required. No records, credentials or signing keys are bundled."
            echo
            echo "APK SHA-256: \`$SUM\`"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release edit "v$V" --title "AttendiFier v$V" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "v$V" --title "AttendiFier v$V" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest
          fi
          gh release upload "v$V" "$APK" --clobber
